server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Routes live in the URL hash (#/1ro/hoja/4), so the server only ever serves
    # real files: anything unknown is a genuine 404.
    location / {
        try_files $uri $uri/ =404;
    }

    # Vite fingerprints everything under /assets, so it can be cached forever.
    # The entry page must not be, or a deploy goes unnoticed.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 512;
}
