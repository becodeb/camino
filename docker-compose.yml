# Deployed by Coolify. Publishes no host port and declares no external network
# on purpose: Coolify attaches the container to its own proxy network and
# generates the Traefik labels itself. Adding either makes the deploy fail.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: camino
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1/index.html']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
